name: Build Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Java mod artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate mod metadata
        run: test -f mod.hjson

      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2extended
          path: build/libs/m2extendedDesktop.jar
          if-no-files-found: error
