name: Build Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build JSON mod artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate mod metadata
        run: test -f mod.hjson

      - name: Package mod
        run: |
          mkdir -p dist
          zip -r dist/m2extended.zip mod.hjson README.md content sprites bundles
          unzip -l dist/m2extended.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2extended
          path: dist/m2extended.zip
          if-no-files-found: error
