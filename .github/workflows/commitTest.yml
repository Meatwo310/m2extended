name: Build Mod

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up PATH
        run: |
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew deploy

      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs/${{ github.event.repository.name }}.jar

      - name: Validate tag version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^"#,]+)"?.*$/\1/p' mod.hjson | head -n 1 | tr -d '\r' | xargs)"

          if [ -z "$mod_version" ]; then
            echo "mod.hjson does not contain a version value." >&2
            exit 1
          fi

          if [ "$tag_version" != "$mod_version" ]; then
            echo "Tag version ($tag_version) must match mod.hjson version ($mod_version)." >&2
            exit 1
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset="build/libs/${{ github.event.repository.name }}.jar"

          gh release create "${GITHUB_REF_NAME}" "$asset" \
            --target "${GITHUB_SHA}" \
            --title "${{ github.event.repository.name }} ${GITHUB_REF_NAME}" \
            --generate-notes
