name: Build Mod

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Android build tools
        shell: bash
        run: |
          set -euo pipefail

          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$android_sdk_root" ]; then
            echo "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set." >&2
            exit 1
          fi

          build_tools_dir="$(find "${android_sdk_root}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          if [ -z "$build_tools_dir" ]; then
            echo "No Android build-tools directory found." >&2
            exit 1
          fi

          echo "$build_tools_dir" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod jar
        run: |
          chmod +x ./gradlew
          ./gradlew deploy

      - name: Upload built jar file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs/${{ github.event.repository.name }}-*.jar

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: buildJar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download built jar file
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}
          path: build/libs

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          asset="$(find build/libs -maxdepth 1 -type f -name '${{ github.event.repository.name }}-*.jar' | head -n 1)"

          if [ -z "$asset" ]; then
            echo "No versioned jar found in build/libs." >&2
            exit 1
          fi

          mod_version="$(unzip -p "$asset" mod.hjson | sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^"#,]+)"?.*$/\1/p' | head -n 1 | tr -d '\r' | xargs)"

          if [ -z "$mod_version" ]; then
            echo "$asset does not contain a generated mod.hjson version value." >&2
            exit 1
          fi

          if [ "$tag_version" != "$mod_version" ]; then
            echo "Tag version ($tag_version) must match mod.hjson version ($mod_version)." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asset="$(find build/libs -maxdepth 1 -type f -name '${{ github.event.repository.name }}-*.jar' | head -n 1)"

          if [ -z "$asset" ]; then
            echo "No versioned jar found in build/libs." >&2
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" "$asset" \
            --target "${GITHUB_SHA}" \
            --title "${{ github.event.repository.name }} ${GITHUB_REF_NAME}" \
            --generate-notes
