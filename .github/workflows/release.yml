name: Release Mod

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version. Leave blank to use mod.hjson.
        required: false
        type: string
      draft:
        description: Create the GitHub Release as a draft.
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(sed -nE 's/^[[:space:]]*version:[[:space:]]*"?([^"#,]+)"?.*$/\1/p' mod.hjson | head -n 1 | tr -d '\r' | xargs)"
          input_version="$(printf '%s' "$RELEASE_INPUT_VERSION" | tr -d '\r' | xargs)"

          if [ -z "$mod_version" ]; then
            echo "mod.hjson does not contain a version value." >&2
            exit 1
          fi

          if [ -n "$input_version" ]; then
            release_version="${input_version#v}"
            if [ "$release_version" != "$mod_version" ]; then
              echo "Input version ($release_version) must match mod.hjson version ($mod_version)." >&2
              exit 1
            fi
          else
            release_version="$mod_version"
          fi

          if ! [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like semantic versioning, for example 1.2.3 or 1.2.3-beta.1." >&2
            exit 1
          fi

          {
            echo "version=$release_version"
            echo "tag=v$release_version"
            echo "asset=m2extended-v$release_version.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release target
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be run from the main branch." >&2
            exit 1
          fi

          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Remote tag ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Package mod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/${{ steps.version.outputs.asset }}" mod.hjson README.md content sprites bundles
          unzip -l "dist/${{ steps.version.outputs.asset }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            "${{ steps.version.outputs.tag }}"
            "dist/${{ steps.version.outputs.asset }}"
            --target "${GITHUB_SHA}"
            --title "m2extended ${{ steps.version.outputs.version }}"
            --generate-notes
          )

          if [ "$RELEASE_DRAFT" = "true" ]; then
            args+=(--draft)
          fi

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
