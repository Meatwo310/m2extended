block.m2extended-lead-armored-conveyor.name = Lead Armored Conveyor
block.m2extended-lead-armored-conveyor.description = A cheap armored conveyor that rejects side input from non-conveyors.
block.m2extended-silicon-armored-conveyor.name = Silicon Armored Conveyor
block.m2extended-silicon-armored-conveyor.description = Moves items at the same speed as a titanium conveyor. Rejects side input from non-conveyors.
block.m2extended-lead-plated-conduit.name = Lead Plated Conduit
block.m2extended-lead-plated-conduit.description = A cheap plated conduit that rejects side input from non-conduits and does not leak.
block.m2extended-silicon-plated-conduit.name = Silicon Plated Conduit
block.m2extended-silicon-plated-conduit.description = Moves liquids at the same speed as a pulse conduit. Rejects side input from non-conduits and does not leak.
block.m2extended-instant-router.name = Instant Router
block.m2extended-instant-router.description = Immediately distributes input items to the other three directions. Does not store items internally.
block.m2extended-instant-junction.name = Instant Junction
block.m2extended-instant-junction.description = Immediately passes crossing items through. Does not store items internally.
block.m2extended-directed-router.name = Directed Instant Router
block.m2extended-directed-router.description = Immediately distributes input items to the other three directions. Does not store items internally.
block.m2extended-right-directed-router.name = Right Instant Router
block.m2extended-right-directed-router.description = Immediately distributes input items forward and right. Does not store items internally.
block.m2extended-left-directed-router.name = Left Instant Router
block.m2extended-left-directed-router.description = Immediately distributes input items forward and left. Does not store items internally.
block.m2extended-directed-junction.name = Directed Instant Junction
block.m2extended-directed-junction.description = Immediately passes crossing items through in the arrow direction. Does not store items internally.
